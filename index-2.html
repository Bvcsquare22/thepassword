<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&display=swap">
<style>
/* Layout: one dark room, a hanging bulb, the reveal centered under its light */
:root {
  --bg: #050607;
  --ink: #f4f1e8;
  --dim: #8d8a82;
  --glow: #fff6d8;
  --cord: #8a4a22;
  --display: 'Zilla Slab', Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  overflow: hidden;
  position: relative;
}
.lamp { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.cord { width: 3px; height: 18vh; background: var(--cord); }
.socket { width: 22px; height: 26px; background: var(--cord); border-radius: 6px 6px 3px 3px; }
.bulb {
  width: 54px; height: 64px; border-radius: 50% 50% 46% 46%;
  background: var(--glow);
  box-shadow: 0 0 40px 18px rgba(255, 246, 216, .55), 0 0 160px 80px rgba(255, 236, 180, .12);
  animation: flicker 3.2s infinite;
}
@keyframes flicker { 0%, 92%, 100% { opacity: 1 } 94% { opacity: .35 } 96% { opacity: 1 } 97% { opacity: .5 } }
@media (prefers-reduced-motion: reduce) { .bulb { animation: none } }
main { display: flex; flex-direction: column; gap: 20px; max-width: 36ch; margin-top: 18vh; }
h1 { font-size: clamp(2.4rem, 9vw, 4.5rem); font-weight: 700; line-height: 1.05; text-wrap: balance; margin: 0; }
p { font-size: 1.2rem; color: var(--dim); margin: 0; }
.label { display: inline-block; background: var(--ink); color: var(--bg); padding: 2px 10px; font-weight: 500; font-size: 1.1rem; }
</style>
</head>
<body>

<div class="lamp" aria-hidden="true"><div class="cord"></div><div class="socket"></div><div class="bulb"></div></div>
<main>
  <span class="label">The password is:</span>
  <h1>You are a fool for scanning.</h1>
  <p>There was never a password.</p>
</main>
</body>
</html>
