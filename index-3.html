<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&display=swap">
<style>
/* Layout: one dark room, a hanging bulb, a fake unlock, then the reveal under its light */
:root {
  --bg: #050607;
  --ink: #f4f1e8;
  --dim: #8d8a82;
  --glow: #fff6d8;
  --cord: #8a4a22;
  --track: #24241f;
  --display: 'Zilla Slab', Georgia, serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  overflow: hidden;
  position: relative;
}
.lamp { position: absolute; top: 0; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.cord { width: 3px; height: 18vh; background: var(--cord); }
.socket { width: 22px; height: 26px; background: var(--cord); border-radius: 6px 6px 3px 3px; }
.bulb {
  width: 54px; height: 64px; border-radius: 50% 50% 46% 46%;
  background: var(--glow);
  box-shadow: 0 0 40px 18px rgba(255, 246, 216, .55), 0 0 160px 80px rgba(255, 236, 180, .12);
  animation: flicker 3.2s infinite;
}
@keyframes flicker { 0%, 92%, 100% { opacity: 1 } 94% { opacity: .35 } 96% { opacity: 1 } 97% { opacity: .5 } }
main { display: flex; flex-direction: column; align-items: center; gap: 20px; width: min(36ch, 100%); margin-top: 18vh; }
.loading { display: flex; flex-direction: column; gap: 16px; width: 100%; }
.loading p { font-size: 1.25rem; color: var(--ink); margin: 0; }
.bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--glow); border-radius: 4px; transition: width 3s cubic-bezier(.3, .1, .3, 1); }
.reveal { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.label { display: inline-block; background: var(--ink); color: var(--bg); padding: 2px 10px; font-weight: 500; font-size: 1.15rem; }
h1 { font-size: clamp(3.4rem, 15vw, 6rem); font-weight: 700; line-height: 1; margin: 0; }
.roast { font-size: 1.15rem; color: var(--dim); margin: 0; text-wrap: balance; }
.reveal.show { animation: pop .5s ease-out; }
@keyframes pop { from { opacity: 0; transform: scale(.94) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .bulb, .reveal.show { animation: none } .fill { transition: none } }
</style>
</head>
<body>

<div class="lamp" aria-hidden="true"><div class="cord"></div><div class="socket"></div><div class="bulb"></div></div>
<main>
  <div class="loading" id="loading">
    <p>Unlocking password…</p>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <div class="reveal" id="reveal" hidden>
    <span class="label">The password is:</span>
    <h1>Gullible.</h1>
    <p class="roast">You scanned a random QR code on the promise of a password. Think about that.</p>
  </div>
</main>
<script>
(function () {
  var fill = document.getElementById('fill');
  var loading = document.getElementById('loading');
  var reveal = document.getElementById('reveal');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function show() { loading.hidden = true; reveal.hidden = false; reveal.classList.add('show'); }
  if (reduce) { show(); return; }
  requestAnimationFrame(function () { requestAnimationFrame(function () { fill.style.width = '100%'; }); });
  setTimeout(show, 3300);
})();
</script>
</body>
</html>
